apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: celsius-to-fahrenheit-ingress
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: celsius-to-fahrenheit-service
                port:
                  number: 80